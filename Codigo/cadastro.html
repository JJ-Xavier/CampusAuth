<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusAuth – Criar conta</title>
</head>
<body>
  <!-- Estrutura provisória: o visual do canvas entra na Área 5. -->
  <main>
    <h1>Criar conta</h1>

    <form id="form-cadastro">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <span id="senha-dica">Mínimo de 6 caracteres.</span>
      <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="6" required aria-describedby="senha-dica">

      <button id="btn-cadastrar" type="submit">Criar conta</button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>
    <p>Já tem conta? <a href="index.html">Entrar</a></p>
  </main>

  <script type="module" src="./js/cadastro.js"></script>
</body>
</html>
