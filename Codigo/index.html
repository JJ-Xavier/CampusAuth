<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusAuth – Entrar</title>
</head>
<body>
  <!-- Estrutura provisória: o visual do canvas entra na Área 5. -->
  <main>
    <h1>Entrar</h1>
    <button id="btn-google" type="button">Entrar com Google</button>

    <p>ou com e-mail</p>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>

      <button id="btn-entrar" type="submit">Entrar</button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>
    <p>Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
